[workspace]
members = ["crates/ncm-core", "crates/ncm-cli"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Johnserf-Seed"]
repository = "https://github.com/Johnserf-Seed/ncm2mp3"

[workspace.dependencies]
aes = "0.9"
ecb = "0.2"
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color", "env"] }
clap_complete = "4.5"
lofty = "0.24"
strfmt = "0.2"
rayon = "1.10"
console = "0.16"
walkdir = "2.5"
globset = "0.4"
strsim = "0.11"
tempfile = "3"
env_logger = "0.11"
log = "0.4"
toml = "1"
dirs = "6"
notify = "8"
notify-debouncer-mini = "0.7"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
