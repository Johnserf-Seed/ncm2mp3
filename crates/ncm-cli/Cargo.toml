[package]
name = "ncm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI to decrypt Netease Cloud Music NCM files"

[[bin]]
name = "ncm2mp3"
path = "src/main.rs"

[dependencies]
# Published to crates.io as `ncm2mp3-core` (the `ncm-core` slot was taken).
# Aliasing it back to `ncm-core` via `package = ...` keeps the existing
# `use ncm_core::…` source unchanged.
ncm-core = { path = "../ncm-core", package = "ncm2mp3-core" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
lofty = { workspace = true }
strfmt = { workspace = true }
rayon = { workspace = true }
console = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
