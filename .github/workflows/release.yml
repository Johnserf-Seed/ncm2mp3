name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ncm2mp3

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p ncm-cli
        shell: bash

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p ncm-cli
        shell: bash

      - name: Stage artifact (Unix)
        if: matrix.os != 'windows-latest'
        id: stage_unix
        shell: bash
        run: |
          STAGE="${BIN_NAME}-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/"
          cp README.md README_en.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          # Emit a sibling .sha256 file — consumed by Scoop's hash.url
          # mechanism, and lets users verify their download:
          #   sha256sum -c ncm2mp3-vX.Y.Z-<target>.tar.gz.sha256
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "asset=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${STAGE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Stage artifact (Windows)
        if: matrix.os == 'windows-latest'
        id: stage_win
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $stage = "$env:BIN_NAME-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $stage
          Copy-Item README.md, README_en.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          # Sibling .sha256 — PowerShell's Get-FileHash output is multi-line,
          # so we format a single-line `<hash>  <filename>` compatible with
          # `sha256sum -c`.
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -FilePath "$stage.zip.sha256" -Encoding ascii -NoNewline
          "asset=$stage.zip"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$stage.zip.sha256"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # Exactly one of the two stage steps runs, based on matrix.os.
          # The unused one's `outputs.asset` / `.sha` is empty, so `||`
          # selects the populated value at runtime. Pattern for `path:`
          # here is a newline-separated list of globs; we package both the
          # archive and its .sha256 into the same artifact bundle.
          path: |
            ${{ steps.stage_unix.outputs.asset || steps.stage_win.outputs.asset }}
            ${{ steps.stage_unix.outputs.sha   || steps.stage_win.outputs.sha   }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
